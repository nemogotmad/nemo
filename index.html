<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2; url=https://rocketurl.uno">
    <title>RAWKEY FLEET | Redirecting...</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Bangers&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 10% 20%, #0a0f1e, #02040c);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(14,16,26,0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            border-top: 4px solid #E02C1E;
            padding: 2rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3rem;
            background: linear-gradient(135deg, #E02C1E, #F5B041);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        .sub {
            color: #F5B041;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
        }
        .compass {
            font-size: 3rem;
            margin: 1rem 0;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .message {
            font-size: 1rem;
            margin: 1rem 0;
            color: #ccc;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #E02C1E, #9A1F14);
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 1rem;
            transition: 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(224,44,30,0.5);
        }
        .footer {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>RAWKEY FLEET</h1>
        <div class="sub">ONE PIECE GRAND LINE</div>
        <div class="compass">🏴‍☠️</div>
        <div class="message">Setting sail to the new world...</div>
        <a href="https://rocketurl.uno" class="btn">⚓ ENTER FLEET ⚓</a>
        <div class="footer">Redirecting automatically...</div>
    </div>
    <script>
        // Fallback redirect after 2 seconds
        setTimeout(function() {
            window.location.href = "https://rocketurl.uno";
        }, 2000);
    </script>
</body>
</html>
